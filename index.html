<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta name="google" content="notranslate">
    <title>28E</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="preload" href="./fonts/Sebenta-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: Sebenta;
            src: url('./fonts/Sebenta-Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Plus Jakarta Sans';
            src: url('./fonts/font_4.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }

        body {
            margin: 0;
            background: #000;
            color: #f7f4ee;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            box-sizing: border-box;
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
                max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
            text-align: center;
        }

        #farewell {
            max-width: 58rem;
            opacity: 1;
            transition: opacity 420ms ease-in-out;
        }

        #farewell.is-fading {
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-family: Sebenta, Georgia, serif;
            font-size: clamp(2.25rem, 6vw, 5rem);
            font-weight: 500;
            line-height: 1.08;
            text-wrap: balance;
        }

        p {
            margin: 1rem auto 0;
            max-width: 40ch;
            color: rgba(244, 239, 231, 0.72);
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.55;
            text-wrap: balance;
        }

        @media (prefers-reduced-motion: reduce) {
            #farewell {
                transition: none;
            }

            #farewell.is-fading {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main>
        <div id="farewell">
            <h1>28E ha llegado a su fin.</h1>
            <p>Gracias por acompañarnos durante todo este tiempo.</p>
        </div>
    </main>
    <audio id="soundtrack" src="./media/cierre-28e.mp3" preload="none" loop></audio>
    <script>
        const messages = [
            ['es', '28E ha llegado a su fin.', 'Gracias por acompañarnos durante todo este tiempo.'],
            ['en', '28E has come to an end.', 'Thank you for being with us all this time.'],
            ['pt', 'O 28E chegou ao fim.', 'Obrigado por nos acompanhar durante todo esse tempo.'],
            ['fr', 'L’aventure 28E touche à sa fin.', 'Merci de nous avoir accompagnés tout ce temps.'],
            ['it', '28E è giunto al termine.', 'Grazie per essere stati con noi per tutto questo tempo.'],
            ['de', '28E ist zu Ende gegangen.', 'Danke, dass ihr uns die ganze Zeit begleitet habt.'],
            ['nl', '28E is ten einde gekomen.', 'Bedankt dat jullie al die tijd bij ons waren.'],
            ['ru', 'Проект 28E завершён.', 'Спасибо, что были с нами всё это время.'],
            ['ar', 'انتهى مشروع 28E.', 'شكرًا لكم على مرافقتنا طوال هذه الفترة.'],
            ['zh-Hans', '28E 项目已结束。', '感谢你们一路相伴。'],
            ['ja', '28Eは終了しました。', 'これまで応援してくださり、ありがとうございました。'],
            ['ko', '28E가 종료되었습니다.', '지금까지 함께해 주셔서 감사합니다.'],
        ];

        const soundtrack = document.querySelector('#soundtrack');
        const farewell = document.querySelector('#farewell');
        const title = farewell.querySelector('h1');
        const thanks = farewell.querySelector('p');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const fadeDuration = 420;
        const languageInterval = 6000;
        let currentMessage = 0;
        let nextChange;

        function showMessage([language, heading, description]) {
            document.documentElement.lang = language;
            document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
            title.textContent = heading;
            thanks.textContent = description;
        }

        function scheduleChange() {
            nextChange = window.setTimeout(() => {
                farewell.classList.add('is-fading');
                nextChange = window.setTimeout(() => {
                    currentMessage = (currentMessage + 1) % messages.length;
                    showMessage(messages[currentMessage]);
                    farewell.classList.remove('is-fading');
                    scheduleChange();
                }, fadeDuration);
            }, languageInterval - fadeDuration);
        }

        function updatePlayback() {
            window.clearTimeout(nextChange);
            farewell.classList.remove('is-fading');

            if (reducedMotion.matches) {
                const preferredMessage = navigator.languages.map((language) =>
                    messages.find(([code]) => code.split('-')[0] === language.split('-')[0])
                ).find(Boolean);
                showMessage(preferredMessage ?? messages[0]);
                return;
            }

            showMessage(messages[currentMessage]);
            scheduleChange();
        }

        reducedMotion.addEventListener('change', updatePlayback);
        updatePlayback();

        soundtrack.volume = 0.3;
        soundtrack.play().catch((error) => {
            if (error.name !== 'NotAllowedError') return;

            document.addEventListener('click', () => {
                soundtrack.play().catch(() => {});
            }, { once: true });
        });
    </script>
</body>
</html>
