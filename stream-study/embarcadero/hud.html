    <style>
        /* Tipografía Oficial 28E (Sebenta) */
        @font-face {
            font-family: 'Sebenta';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('../../fonts/Sebenta-Medium.woff2') format('woff2'),

                 url('https://cdn.epidemicsound.com/fonts/Sebenta-Medium.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Sebenta';
            font-style: italic;
            font-weight: 500;
            font-display: swap;
            src: url('../../fonts/Sebenta-MediumItalic.woff2') format('woff2'),

                 url('https://cdn.epidemicsound.com/fonts/Sebenta-MediumItalic.woff2') format('woff2');
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html {
            font-size: clamp(13px, 1.354167vw, 32px);
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #05060d;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.stream-kiosk,

            cursor: none !important;

        /* Fondo de video prerenderizado 30 FPS */
        .video-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            background: #05060d;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: 0;
            pointer-events: none;

        /* Velos direccionales suaves: mantienen luminoso el centro y aseguran contraste en bordes */

            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;

        .header {
            display: flex;

        .brand-logo {

            font-size: 1.95rem;

            letter-spacing: -0.055em;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 3px 16px rgba(0, 0, 0, 0.72);
            padding-top: 0.08rem;

        /* ─── Contador Superior: Días | HH : MM : SS ─── */
        .countdown-container {

            align-items: flex-start;

        .countdown-eyebrow {
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.16em;

        .cd-row {
            display: flex;

        .cd-days-wrap {

        .cd-days-val {
            font-size: 2.05rem;
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.025em;
            color: #ffffff;
            text-shadow: 0 3px 16px rgba(0, 0, 0, 0.85);

            font-weight: 400;
            color: rgba(255, 255, 255, 0.90);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);

        .cd-divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.36);
            margin: 0.08rem 1.05rem;
            align-self: stretch;
            flex-shrink: 0;

        .cd-hms-row {
            display: flex;
            align-items: flex-start;
            gap: 0.35rem;
        }

        .cd-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 2.1rem;

        .cd-val {
            font-size: 1.42rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;

            text-shadow: 0 3px 16px rgba(0, 0, 0, 0.85);

        .cd-sep {

        /* ─── Zona Inferior: Cuadrícula Editorial ─── */
        .bottom-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: auto auto;
            column-gap: 2.5rem;

            white-space: nowrap;

                align-items: flex-start;
                gap: 1rem;

            .bottom-wrap {
                grid-template-columns: minmax(0, 1fr);
                row-gap: 0.85rem;
            }

            .clock-col {
                grid-column: 1;
                grid-row: 2;
                align-items: flex-start;
                text-align: left;
                padding-top: 0;
            }

            .news-line {
                grid-row: 3;
            }
        }
    </style>
</head>

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js';
        import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js';

        const Q = new URLSearchParams(window.location.search);
        const BASE = window.location.pathname.includes('/stream-study/embarcadero/') ? '../../' : '';
        const IS_EMITTER = Q.has('emit');
        if (Q.has('stream') || IS_EMITTER) {
            document.body.classList.add('stream-kiosk');
        }

        // ── 1. Contador exacto al 00:00:00 del 21 de Noviembre (Hora oficial Venezuela UTC-4) ──
        let TARGET_DATE = new Date('2026-11-21T00:00:00-04:00');

        const elD = document.getElementById('cd-d');
        const elDUnit = document.getElementById('cd-d-unit');
        const elH = document.getElementById('cd-h');
        const elM = document.getElementById('cd-m');
        const elS = document.getElementById('cd-s');
        const elClock = document.getElementById('live-clock');

        const clockFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/Caracas',
            weekday: 'short',
            day: 'numeric',
            month: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });
        const WEEKDAYS_ES = { Sun: 'Dom', Mon: 'Lun', Tue: 'Mar', Wed: 'Mié', Thu: 'Jue', Fri: 'Vie', Sat: 'Sáb' };
        const MONTHS_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

        let serverTimeOffset = 0;
        let streamLatencyMs = IS_EMITTER || Q.has('stream') ? 8000 : 0;
        let lastClockMarkup = '';

        function tick() {
            const nowMs = Date.now() + serverTimeOffset + streamLatencyMs;
            const now = new Date(nowMs);

            if (elClock) {
                const parts = clockFormatter.formatToParts(now);
                const getP = (type) => parts.find(p => p.type === type)?.value || '';
                const wDay = WEEKDAYS_ES[getP('weekday')] || getP('weekday');
                const dayNum = getP('day');
                const monthName = MONTHS_ES[(parseInt(getP('month'), 10) || 1) - 1];
                const hourVal = getP('hour');
                const minVal = getP('minute');
                const dayPeriod = (getP('dayPeriod') || '').toUpperCase().replace(/\./g, '').replace(/\s+/g, '');
                const nextMarkup = `<span class="clock-date">${wDay}, ${dayNum} ${monthName}</span><span class="clock-sep">·</span><span class="clock-time">${hourVal}:${minVal} ${dayPeriod}</span>`;
                if (nextMarkup !== lastClockMarkup) {
                    lastClockMarkup = nextMarkup;
                    elClock.innerHTML = nextMarkup;
                }
            }

            const diff = TARGET_DATE.getTime() - nowMs;
            if (diff <= 0) {
                if (elD && elD.textContent !== '00') elD.textContent = '00';
                if (elH && elH.textContent !== '00') elH.textContent = '00';
                if (elM && elM.textContent !== '00') elM.textContent = '00';
                if (elS && elS.textContent !== '00') elS.textContent = '00';
                return;
            }

            const daysNum = Math.floor(diff / (1000 * 60 * 60 * 24));
            const dStr = String(daysNum).padStart(2, '0');
            const hStr = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            const mStr = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
            const sStr = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

            if (elD && elD.textContent !== dStr) elD.textContent = dStr;
            if (elDUnit) {
                const unitTxt = daysNum === 1 ? 'día' : 'días';
                if (elDUnit.textContent !== unitTxt) elDUnit.textContent = unitTxt;
            }
            if (elH && elH.textContent !== hStr) elH.textContent = hStr;
            if (elM && elM.textContent !== mStr) elM.textContent = mStr;
            if (elS && elS.textContent !== sStr) elS.textContent = sStr;
        }

        setInterval(tick, 100);
        tick();

        // ── 2. Conexión Realtime a 28E Radio (Sincronizado vía Firebase) ──
        const firebaseConfig = {
            apiKey: "AIzaSyDFkuktrXnsV9-jg2bv5dpJQRR-he8PT3g",
            authDomain: "yaire-591ca.firebaseapp.com",
            databaseURL: "https://yaire-591ca-default-rtdb.firebaseio.com",
            projectId: "yaire-591ca",
            storageBucket: "yaire-591ca.firebasestorage.app",
            messagingSenderId: "450381430658",
            appId: "1:450381430658:web:262d1bb7b1732c3990d99b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'radio_state/targetDate'), snap => {
            const val = snap.val();
            if (val) {
                const parsed = new Date(val);
                if (!isNaN(parsed.getTime())) {
                    TARGET_DATE = parsed;
                    tick();
                }
            }
        });

        onValue(ref(db, 'radio_state/streamLatencyMs'), snap => {
            if (!(IS_EMITTER || Q.has('stream'))) return;
            const val = Number(snap.val());
            if (!isNaN(val) && val >= 0 && val <= 30000) {
                streamLatencyMs = val;
                tick();
            }
        });

        let initialReloadToken = null;
        onValue(ref(db, 'radio_state/reloadToken'), snap => {
            const token = snap.val();
            if (initialReloadToken === null) {
                initialReloadToken = token || 0;
            } else if (token && token !== initialReloadToken && IS_EMITTER) {
                window.location.reload();
            }
        });

        const baseSongs = [

            { title: "Paulo Coelho", artist: "Otis McDonald, Mani Draper", src: "radio/stream in youtube/Otis McDonald - Paulo Coelho.mp3", duration: 149.1 },
            { title: "Menea", artist: "Master One, Lawd Ito", src: "radio/stream in youtube/ES_Menea - Master One.mp3", duration: 198.8 },

            { title: "Cheers to Frank", artist: "Otis McDonald", src: "radio/stream in youtube/Otis McDonald - Cheers to Frank.mp3", duration: 177.5 },
            { title: "Loko", artist: "Lawd Ito, Nicolas Rengifo", src: "radio/1792559637795_ES_Loko_-_Lawd_Ito.mp3", duration: 166.0 },
            { title: "Tulipanes Pa' Yaire", artist: "Rodezel", src: "radio/stream in youtube/Tulipanes Pa' Yaire - Rodezel.mp3", duration: 177.2 },

        const radioTracks = [];
        for (let i = 0, identStep = 0; i < baseSongs.length; i++) {
            radioTracks.push(baseSongs[i]);

        const audio = document.getElementById('audio-elem');

        let currentRadioState = null;
        let currentTrackIdx = -1;
        let hasInitialSynced = false;
        let activeMetaHandler = null;
        let endedTimer = null;

        function resolveSrc(relSrc) {
            return BASE ? (BASE + relSrc) : relSrc;
        }

        onValue(ref(db, '.info/serverTimeOffset'), snap => {
            serverTimeOffset = snap.val() || 0;
        });

        // Un mismo archivo conserva su identidad aunque cambie de carpeta o llegue como URL.
        function trackFilename(src) {
            if (!src) return '';
            try {
                return decodeURIComponent(new URL(src, document.baseURI).pathname.split('/').pop());
            } catch (_) {
                return '';
            }
        }

        function findTrackIndex(src, hintIdx) {
            const filename = trackFilename(src);
            if (Number.isInteger(hintIdx) && radioTracks[hintIdx] &&
                (!src || trackFilename(radioTracks[hintIdx].src) === filename)) {
                return hintIdx;
            }
            const idx = radioTracks.findIndex(track => trackFilename(track.src) === filename);
            return idx >= 0 ? idx : 0;
        }

        function resolveLiveTrack(startTrackSrc, startTimeMs, nowMs, hintIdx) {
            let idx = findTrackIndex(startTrackSrc, hintIdx);
            const cycleSeconds = radioTracks.reduce((total, track) => total + track.duration, 0);
            let elapsed = Math.max(0, (nowMs - startTimeMs) / 1000) % cycleSeconds;
            while (elapsed >= radioTracks[idx].duration) {
                elapsed -= radioTracks[idx].duration;
                idx = (idx + 1) % radioTracks.length;
            }
            return {
                track: radioTracks[idx],
                idx,
                seekTime: elapsed,
                virtualStartTime: nowMs - Math.round(elapsed * 1000)
            };
        }

        function preloadNextTrack(idx) {
            if (idx < 0 || !radioTracks.length) return;
            const nextTrack = radioTracks[(idx + 1) % radioTracks.length];
            if (nextTrack && nextTrack.src) {
                const localSrc = resolveSrc(nextTrack.src);
                const targetUrl = new URL(localSrc, document.baseURI).href;
                if (nextAudioPreloader.src !== targetUrl) {
                    nextAudioPreloader.src = localSrc;
                    nextAudioPreloader.load();
                }
            }
        }

        function updateNowPlayingUI(track) {
            if (!track || (!elSongTitle && !elSongArtist)) return;

            const nextTitle = track.title || '';
            const nextArtist = track.artist || 'Selección 28E';
            const curTitle = elSongTitle ? elSongTitle.textContent : '';
            const curArtist = elSongArtist ? elSongArtist.textContent : '';

            if (!musicFadeTimer && curTitle === nextTitle && curArtist === nextArtist) return;
            if (musicFadeTimer && pendingSongTitle === nextTitle && pendingSongArtist === nextArtist) return;

            if (musicFadeTimer) {
                clearTimeout(musicFadeTimer);
                musicFadeTimer = null;
            }

            pendingSongTitle = nextTitle;
            pendingSongArtist = nextArtist;

            if (elSongTitle) elSongTitle.style.opacity = '0';
            if (elSongArtist) elSongArtist.style.opacity = '0';

            musicFadeTimer = setTimeout(() => {
                musicFadeTimer = null;
                pendingSongTitle = null;
                pendingSongArtist = null;

                if (elSongTitle) elSongTitle.textContent = nextTitle;
                if (elSongArtist) elSongArtist.textContent = nextArtist;
                if (elSongTitle) void elSongTitle.offsetWidth;
                if (elSongTitle) elSongTitle.style.opacity = '1';
                if (elSongArtist) elSongArtist.style.opacity = '1';
            }, 300);
        }

        const statusElement = document.getElementById('radio-status');
        const statusMessages = new Map();
        function reportRadioStatus(key, message = '') {
            if (message) statusMessages.set(key, message);
            else statusMessages.delete(key);
            statusElement.textContent = [...statusMessages.values()].join(' ');
            statusElement.hidden = statusMessages.size === 0;
        }

        const auth = getAuth(app);
        const requiresPublisherAuth = Q.get('auth') !== 'optional';
        let pendingPublication = null;
        let publishing = false;

        async function publishRadioState(state) {
            if (!IS_EMITTER) return;
            pendingPublication = state;
            if (!auth.currentUser && requiresPublisherAuth) {
                reportRadioStatus('publication', 'Emisor sin sesión. Inicia sesión en el panel de administración desde este mismo navegador y origen.');
                return;
            }
            if (publishing) return;
            publishing = true;
            try {
                while (pendingPublication && (auth.currentUser || !requiresPublisherAuth)) {
                    const latest = pendingPublication;
                    pendingPublication = null;
                    await set(ref(db, 'radio_state/current'), latest);
                }
                reportRadioStatus('publication');
            } catch (error) {
                // Conservar el estado más reciente para reintentar tras reconectar.
                pendingPublication = currentRadioState;
                console.error('No se pudo publicar el estado de Radio 28E', error);
                reportRadioStatus('publication', 'No se pudo sincronizar el emisor. Revisa su sesión y los permisos de Firebase.');
            } finally {
                publishing = false;
            }
        }

        if (IS_EMITTER) {
            onAuthStateChanged(auth, () => {
                if (currentRadioState) publishRadioState(currentRadioState);
            });
            onValue(ref(db, '.info/connected'), snapshot => {
                if (snapshot.val() && pendingPublication) publishRadioState(currentRadioState);
            });
            setInterval(() => {
                if (pendingPublication && (auth.currentUser || !requiresPublisherAuth)) publishRadioState(currentRadioState);
            }, 15000);
        }

        function playAudio() {
            audio.play().then(() => reportRadioStatus('playback')).catch(error => {
                if (error.name === 'AbortError') return;
                console.error('No se pudo iniciar el audio', error);
                reportRadioStatus('playback', error.name === 'NotAllowedError'
                    ? 'Pulsa la pantalla para activar el audio.'
                    : 'No se pudo reproducir la pista. Reintentando con la siguiente.');
                if (error.name !== 'NotAllowedError') scheduleAdvance(1000);
            });
        }

        function loadAndPlayTrack(idx, seekTime = 0, allowSeek = false) {
            const track = radioTracks[idx];
            if (!track || !track.src) return;
            clearTimeout(endedTimer);
            endedTimer = null;
            currentTrackIdx = idx;
            updateNowPlayingUI(track);
            preloadNextTrack(idx);

            if (activeMetaHandler) audio.removeEventListener('loadedmetadata', activeMetaHandler);
            activeMetaHandler = null;

            const startPlayback = () => {
                if (currentRadioState?.isPlaying === false) return;
                if (allowSeek && Number.isFinite(audio.duration)) {
                    const target = Math.max(0, Math.min(seekTime, audio.duration - 0.05));
                    if (Math.abs(audio.currentTime - target) > 1.5) {
                        try { audio.currentTime = target; } catch (_) { }
                    }
                }
                playAudio();
            };
            const localSrc = resolveSrc(track.src);
            if (audio.src !== new URL(localSrc, document.baseURI).href) {
                audio.src = localSrc;
                activeMetaHandler = () => {
                    audio.removeEventListener('loadedmetadata', activeMetaHandler);
                    activeMetaHandler = null;
                    startPlayback();
                };
                audio.addEventListener('loadedmetadata', activeMetaHandler);
                audio.load();
            } else if (audio.readyState >= 1 && !audio.error) {
                startPlayback();
            } else {
                activeMetaHandler = () => {
                    audio.removeEventListener('loadedmetadata', activeMetaHandler);
                    activeMetaHandler = null;
                    startPlayback();
                };
                audio.addEventListener('loadedmetadata', activeMetaHandler);
                audio.load();
            }
        }

        function scheduleAdvance(delay = 200) {
            if (endedTimer || !hasInitialSynced || currentRadioState?.isPlaying === false) return;
            endedTimer = setTimeout(() => {
                endedTimer = null;
                if (currentRadioState?.isPlaying !== false) advanceTrack();
            }, delay);
        }

        function advanceTrack() {
            const curIdx = currentTrackIdx >= 0 ? currentTrackIdx : 0;
            const nextIdx = (curIdx + 1) % radioTracks.length;
            const track = radioTracks[nextIdx];
            currentRadioState = {
                title: track.title,
                artist: track.artist,
                src: track.src,
                trackIdx: nextIdx,
                startTime: Date.now() + serverTimeOffset,
                isPlaying: true,
                source: 'auto'
            };
            loadAndPlayTrack(nextIdx);
            publishRadioState(currentRadioState);
        }

        function syncTrack(state) {
            if (!state || typeof state.src !== 'string') return;
            const previous = currentRadioState;
            // Una confirmación antigua de nuestra escritura puede llegar tras el siguiente tema.
            if (IS_EMITTER && publishing && previous?.source === 'auto' &&
                state.source === 'auto' && previous.startTime > state.startTime) return;
            currentRadioState = state;
            pendingPublication = null;

            if (state.isPlaying === false) {
                clearTimeout(endedTimer);
                endedTimer = null;
                updateNowPlayingUI(radioTracks[findTrackIndex(state.src, state.trackIdx)]);
                audio.pause();
                return;
            }

            // El emisor recibe su propia escritura. Evitar reiniciar una pista en curso.
            if (IS_EMITTER && hasInitialSynced && previous?.isPlaying !== false &&
                previous?.src === state.src && previous?.startTime === state.startTime) return;

            const now = Date.now() + serverTimeOffset;
            const startTime = Number.isFinite(state.startTime) ? state.startTime : now;
            const resolved = resolveLiveTrack(state.src, startTime, now, state.trackIdx);
            hasInitialSynced = true;
            loadAndPlayTrack(resolved.idx, resolved.seekTime, true);

            if (IS_EMITTER && (trackFilename(resolved.track.src) !== trackFilename(state.src) ||
                Math.abs(resolved.virtualStartTime - startTime) > 1500)) {
                currentRadioState = {
                    title: resolved.track.title,
                    artist: resolved.track.artist,
                    src: resolved.track.src,
                    trackIdx: resolved.idx,
                    startTime: resolved.virtualStartTime,
                    isPlaying: true,
                    source: 'auto'
                };
                publishRadioState(currentRadioState);
            }
        }

        onValue(ref(db, 'radio_state/current'), snapshot => {
            syncTrack(snapshot.val());
        }, error => {
            console.error('No se pudo leer el estado de Radio 28E', error);
            reportRadioStatus('connection', 'No se pudo leer la radio desde Firebase.');

        fetch('https://yaire-591ca-default-rtdb.firebaseio.com/radio_state/current.json')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);

        audio.addEventListener('ended', () => scheduleAdvance());

        const elNewsRow = document.getElementById('news-row');

        const elNewsTitle = document.getElementById('news-title');

        const RADIO_PROMOS = [
            { category: 'INFO', title: 'Sintonízanos donde estés desde TuneIn buscando Twenty Eight Experience Radio', promotion: true },
            { category: 'INFO', title: 'Si tienes una Alexa cerca, solo dile: “Alexa, reproduce Radio Veintiocho”', promotion: true }
        ];
        const NEWS_MAX_HOURS = {
            'INTERNACIONAL': 28, 'VENEZUELA': 32, 'REP. DOMINICANA': 32,
            'ECONOMÍA': 36, 'TECNOLOGÍA': 42, 'CULTURA & MÚSICA': 48, 'GAMING': 48, 'DEPORTES': 30
        };
        function classifyNewsItem(item) {
            if (!item || typeof item.title !== 'string') return item;
            const gaming = /\b(videojuegos?|gameplay|dlc|firefight|playstation|xbox|nintendo|steam|fortnite|minecraft|pubg|half-life|halo:\s*campaign|halo\s+campaign|the outer worlds)\b/i.test(item.title) ||
                ['Eurogamer.es', 'Gamereactor.es'].includes(item.source);
            if (gaming && item.category !== 'UN DÍA COMO HOY') {
                return { ...item, category: 'GAMING' };
            }
            return item;
        }

        const cachedNews = (window.__radioNewsCache?.items || []).map(classifyNewsItem);
        let newsList = [];
        let newsIdx = 0;
        let promoIdx = 0;
        let newsSincePromo = 0;
        let currentNewsItem = null;
        let receivedNewsSnapshot = false;
        let newsTimer = null;
        let newsFadeTimer = null;

        function isNewsFresh(item) {
            if (!item || typeof item.title !== 'string' || !item.title.trim()) return false;
            const now = Date.now() + serverTimeOffset;
            const explicitExpiry = Date.parse(item.expiresAt);
            if (item.category === 'UN DÍA COMO HOY') return Number.isFinite(explicitExpiry) && explicitExpiry > now;
            const maxHours = NEWS_MAX_HOURS[item.category];
            const published = Date.parse(item.publishedAt);
            if (!maxHours || !Number.isFinite(published) || published > now + 2 * 3600000) return false;
            const expiry = Math.min(published + maxHours * 3600000,
                Number.isFinite(explicitExpiry) ? explicitExpiry : Infinity);
            return now < expiry;
        }

        function scheduleNextNews(durationMs = 14000) {
            if (newsTimer) clearTimeout(newsTimer);
            newsTimer = setTimeout(cycleNews, durationMs);
        }

        function renderNewsItem(item, fade = true) {
            if (!item || !elNewsTitle) return;
            if (newsFadeTimer) {
                clearTimeout(newsFadeTimer);
                newsFadeTimer = null;
            }
            const apply = () => {
                if (!item.promotion && !isNewsFresh(item)) {
                    cycleNews(false);
                    return;
                }
                currentNewsItem = item;
                const cat = item.category || 'ACTUALIDAD';
                if (elNewsCat) elNewsCat.textContent = cat;

                const cleanText = (item.title || '').trim().replace(/\.+$/, '');
                const isEphemeris = cat.toUpperCase().includes('DÍA');
                elNewsTitle.textContent = cleanText;

                const isLong = cleanText.length > 70 || isEphemeris;
                scheduleNextNews(isLong ? 16000 : 13000);

                if (elNewsRow) {
                    if (fade) {
                        elNewsRow.style.transition = 'none';
                        elNewsRow.style.transform = 'translateY(5px)';
                        elNewsRow.style.opacity = '0';
                        void elNewsRow.offsetWidth;
                        elNewsRow.style.transition = '';
                    }
                    elNewsRow.style.transform = 'translateY(0)';
                    elNewsRow.style.opacity = '1';
                }
            };
            if (fade && elNewsRow) {
                elNewsRow.style.opacity = '0';
                elNewsRow.style.transform = 'translateY(-4px)';
                newsFadeTimer = setTimeout(() => {
                    newsFadeTimer = null;
                    apply();
                }, 260);
            } else {
                apply();
            }
        }

        function cycleNews(fade = true) {
            const fresh = newsList.filter(isNewsFresh);
            reportRadioStatus('news', fresh.length ? '' : 'Noticias pendientes de actualización.');
            if (fresh.length === 0 || newsSincePromo >= Math.min(8, fresh.length)) {
                const promo = RADIO_PROMOS[promoIdx % RADIO_PROMOS.length];
                promoIdx++;
                newsSincePromo = 0;
                renderNewsItem(promo, fade);
                return;
            }
            const item = fresh[newsIdx % fresh.length];
            newsIdx = (newsIdx + 1) % fresh.length;
            newsSincePromo++;
            renderNewsItem(item, fade);
        }

        function acceptNews(data) {
            const incoming = Array.isArray(data) ? data : Object.values(data || {});
            const fresh = incoming.map(classifyNewsItem).filter(isNewsFresh);
            newsList = fresh.length ? fresh : cachedNews.filter(isNewsFresh);
            newsIdx = 0;
            newsSincePromo = 0;
            cycleNews(false);
        }

        onValue(ref(db, 'radio_state/news/items'), snapshot => {
            receivedNewsSnapshot = true;
            acceptNews(snapshot.val());
        }, error => console.error('No se pudo actualizar el cintillo', error));

        fetch('https://yaire-591ca-default-rtdb.firebaseio.com/radio_state/news/items.json')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => {
                if (!receivedNewsSnapshot) acceptNews(data);
            })
            .catch(error => console.error('Lectura inicial de noticias fallida', error));

        acceptNews(cachedNews);
        setInterval(() => {
            if (currentNewsItem && !currentNewsItem.promotion && !isNewsFresh(currentNewsItem)) {
                cycleNews(false);
            }
        }, 1000);

        window.addEventListener('click', () => {
            if (audio.paused && (!currentRadioState || currentRadioState.isPlaying !== false)) {
                playAudio();
            }
        }, { passive: true });

        // ── 4. Clima en vivo (Open-Meteo) ──
        const WEATHER_CITIES = [
            { name: 'Caracas', lat: 10.4806, lon: -66.9036 },
            { name: 'Santo Domingo', lat: 18.4861, lon: -69.9312 }
        ];
        const WEATHER_CFG = { everyMs: 15 * 60 * 1000, rotateMs: 15000 };
        const elWeather = document.getElementById('live-weather');
        const WX_ICONS = {
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
            moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
            cloud: '<path d="M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
            rain: '<path d="M16 13v8M8 13v8M12 15v8M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/>',
            storm: '<path d="M19 16.9A5 5 0 0 0 18 7h-1.3a8 8 0 1 0-11.6 9M13 11l-4 6h6l-4 6"/>',
            snow: '<path d="M20 17.6A5 5 0 0 0 18 8h-1.3A8 8 0 1 0 4 16.3M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/>',
            fog: '<path d="M3 8h18M5 12h14M3 16h18"/>'
        };
        function describeWeather(code, isDay) {
            if (code === 0) return isDay ? ['sun', 'Despejado'] : ['moon', 'Despejado'];
            if (code === 1) return isDay ? ['sun', 'Mayormente despejado'] : ['moon', 'Mayormente despejado'];
            if (code === 2) return ['cloud', 'Parcialmente nublado'];
            if (code === 3) return ['cloud', 'Nublado'];
            if (code === 45 || code === 48) return ['fog', 'Niebla'];
            if (code >= 51 && code <= 57) return ['rain', 'Llovizna'];
            if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ['rain', code >= 80 ? 'Chubascos' : 'Lluvia'];
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['snow', 'Nieve'];
            if (code >= 95) return ['storm', 'Tormenta'];
            return ['cloud', 'Nublado'];
        }
        let weatherData = [];
        let weatherIdx = 0;
        let lastWeatherMarkup = '';

        function weatherMarkup(w) {
            const [icon] = describeWeather(w.code, w.isDay);
            return `<svg class="wx-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${WX_ICONS[icon]}</svg><span class="wx-city">${w.name}</span><span class="wx-sep">·</span><span class="wx-temp">${w.temp} °C</span>`;
        }

        function showWeather(fade) {
            if (!elWeather || weatherData.length === 0) return;
            const markup = weatherMarkup(weatherData[weatherIdx % weatherData.length]);
            if (markup === lastWeatherMarkup) return;
            const apply = () => {
                lastWeatherMarkup = markup;
                elWeather.innerHTML = markup;
                elWeather.hidden = false;
                elWeather.style.opacity = '1';
            };
            if (fade && !elWeather.hidden) {
                elWeather.style.opacity = '0';
                setTimeout(apply, 350);
            } else {
                apply();
            }
        }

        async function updateWeather() {
            if (!elWeather) return;
            try {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), 8000);
                const lats = WEATHER_CITIES.map(c => c.lat).join(',');
                const lons = WEATHER_CITIES.map(c => c.lon).join(',');
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code,is_day&timezone=auto`, { signal: ctrl.signal, cache: 'no-store' });
                clearTimeout(to);
                const json = await res.json();
                const list = Array.isArray(json) ? json : [json];
                const fresh = [];
                list.forEach((r, i) => {
                    const c = r && r.current;
                    if (c && typeof c.temperature_2m === 'number' && WEATHER_CITIES[i]) {
                        fresh.push({ name: WEATHER_CITIES[i].name, temp: Math.round(c.temperature_2m), code: c.weather_code, isDay: c.is_day === 1 });
                    }
                });
                if (fresh.length > 0) {
                    weatherData = fresh;
                    showWeather(false);
                }
            } catch (_) { }
        }
        updateWeather();
        setInterval(updateWeather, WEATHER_CFG.everyMs);
        setInterval(() => {
            if (weatherData.length > 1) {
                weatherIdx = (weatherIdx + 1) % weatherData.length;
                showWeather(true);
            }
        }, WEATHER_CFG.rotateMs);
    </script>
</body>
